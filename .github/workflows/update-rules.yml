name: Update AI rules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  push:
    paths:
      - scripts/**
      - custom/**
      - .github/workflows/update-rules.yml
permissions:
  contents: write
concurrency:
  group: update-ai-rules
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate all rules
        run: python scripts/sync.py
      - name: Publish validated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules templates manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update validated AI rules'
          git push
